name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API — PHPUnit (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      # Host port 5434 matches phpunit.xml, which is what actually configures the
      # test connection (bahr_test / bahr / secret) — the .env copy below never
      # overrides those.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bahr_test
          POSTGRES_USER: bahr
          POSTGRES_PASSWORD: secret
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U bahr"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          # Same extension set as the production image (api/Dockerfile). Redis is
          # absent on purpose: the app talks to it through predis, and the tests
          # run with array cache / sync queue anyway.
          extensions: pdo_pgsql, zip, intl, gd, bcmath, mbstring
          coverage: none

      - name: Cache composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run tests
        # Scout uses the collection engine under phpunit (phpunit.xml), so no
        # Meilisearch service is needed; Gotenberg is not exercised by the suite.
        run: php artisan test --compact

  web-build:
    name: Web — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # next.config.ts emits standalone output — the same build the production
        # image runs. NEXT_PUBLIC_* are inlined here only to satisfy the build.
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_REVERB_KEY: ci-placeholder
          NEXT_PUBLIC_REVERB_HOST: localhost

  docker-images:
    name: Ops — production images build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Catches Dockerfile drift (a new PHP extension, a moved config file)
      # before a deploy discovers it on the droplet. Images are not pushed.
      - name: Build API image (php-fpm)
        uses: docker/build-push-action@v7
        with:
          context: ./api
          target: app
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build API image (nginx)
        uses: docker/build-push-action@v7
        with:
          context: ./api
          target: nginx
          push: false
          cache-from: type=gha

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://example.com/api/v1
            NEXT_PUBLIC_REVERB_KEY=ci-placeholder
            NEXT_PUBLIC_REVERB_HOST=example.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
