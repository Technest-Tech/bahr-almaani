# Shared request routing, included by both the :80 and :443 server blocks in
# app.conf. Kept in one file so the two can never drift apart — a route added
# for HTTP but forgotten for HTTPS is exactly the bug this prevents.

root /var/www/html/public;
index index.php;

charset utf-8;
client_max_body_size 60m;   # keep in step with php.ini post_max_size

access_log /dev/stdout;
error_log  /dev/stderr warn;

# Websockets: Reverb speaks the Pusher protocol under /app/{key}.
location ~ ^/(app|apps)/ {
    proxy_pass http://reverb;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;   # idle sockets must survive a quiet night
    proxy_send_timeout 3600s;
}

# Laravel: API, broadcasting auth, health probe, signed downloads.
location ~ ^/(api|broadcasting|up|storage)(/|$) {
    try_files $uri /index.php?$query_string;
}

location = /index.php {
    include fastcgi_params;
    fastcgi_pass php-fpm;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param HTTPS $http_x_forwarded_proto;
    fastcgi_read_timeout 300;   # long enough for an export or a merge
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
}

# Nothing else may reach PHP directly.
location ~ \.php$ {
    return 404;
}

# FPM's own status/ping endpoints stay inside the network.
location ~ ^/(fpm-status|fpm-ping)$ {
    deny all;
}

# Everything else is the Next.js app.
location / {
    proxy_pass http://nextjs;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ /\.(?!well-known) {
    deny all;
}
