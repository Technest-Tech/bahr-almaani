# Bahr Al-Maaani — single entry point for the whole stack.
#
#   /                  → Next.js (web container)
#   /api, /broadcasting, /up, /storage → Laravel (app container, FastCGI)
#   /app/, /apps/      → Reverb websockets (reverb container)
#
# One origin means no CORS in production and one TLS certificate.
#
# TLS: set TLS_DOMAIN and mount /etc/letsencrypt, and the :443 block in
# tls.conf switches itself on (see docker/nginx/40-enable-tls.sh). Without a
# certificate the stack still serves plain HTTP, which is what the local
# HTTP_PORT=8081 bring-up in docs/DEPLOYMENT.md relies on.

upstream php-fpm {
    server app:9000;
}

upstream nextjs {
    server web:3000;
}

upstream reverb {
    server reverb:8080;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    # Certbot webroot — served before anything else, and never redirected to
    # https, or an HTTP-01 renewal could not complete.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    include /etc/nginx/locations.conf;
}

# The :443 server block, written here only when a certificate is mounted.
# A glob matching nothing is not an error, so this line is a no-op on HTTP-only
# deployments.
include /etc/nginx/tls/*.conf;
