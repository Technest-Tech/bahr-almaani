# TLS server block. Not loaded directly — 40-enable-tls.sh substitutes
# __DOMAIN__ and writes this into /etc/nginx/tls/ only when the certificate for
# that domain is actually mounted, so a missing cert degrades to HTTP instead
# of refusing to start nginx.

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/__DOMAIN__/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cloudflare is the only client that reaches this port in the intended
    # topology, but stapling costs nothing and helps if the origin is ever
    # exposed directly.
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # One year, no preload: preload is effectively irreversible and this domain
    # may still need to move.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/locations.conf;
}
