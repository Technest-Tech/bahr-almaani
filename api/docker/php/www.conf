; FPM pool overrides. Sized for a 2–4 vCPU droplet; raise pm.max_children only
; together with the droplet's RAM (each child peaks around 100 MB with FPDI).
[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Health probe target for the container healthcheck.
pm.status_path = /fpm-status
ping.path = /fpm-ping

clear_env = no

catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
