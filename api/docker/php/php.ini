; Uploads: source documents can be large scans. Both limits must stay at or above
; App\Support\Uploads::MAX_FILE_KB, and post_max_size carries a whole delivery
; (every file of one delivery is posted together), hence the extra headroom.
; UploadLimitsTest fails if these drop below the rule the app enforces.
upload_max_filesize = 200M
post_max_size = 300M
memory_limit = 512M
max_execution_time = 120

expose_php = Off
date.timezone = UTC

; Logs go to the container's stderr so `docker compose logs` sees them.
log_errors = On
error_log = /dev/stderr
display_errors = Off
