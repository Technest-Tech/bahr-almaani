; Uploads: source documents can be large scans — keep this in step with
; ProjectFileController::MAX_FILE_KB and the nginx client_max_body_size.
upload_max_filesize = 50M
post_max_size = 60M
memory_limit = 512M
max_execution_time = 120

expose_php = Off
date.timezone = UTC

; Logs go to the container's stderr so `docker compose logs` sees them.
log_errors = On
error_log = /dev/stderr
display_errors = Off
